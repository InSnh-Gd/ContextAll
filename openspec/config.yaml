schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
context: |
  session-protocol is the merged MVP. lan-device-link was folded into it.
  Where an older note disagrees with session-protocol, follow session-protocol.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
operations:
  apply:
    guidance:
      - When every implementation task for one capability is checked, update docs/specs/<capability>.md in Chinese in the same change, then move that row to the synced table in docs/README.md. Document only behavior the spec and the code both already have.
  archive:
    guidance:
      - Before archive, each capability in the change has a current Chinese doc at docs/specs/<capability>.md and a synced row in docs/README.md.
